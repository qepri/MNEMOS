services:
  frontend:
    build: ./frontend_spa
    restart: unless-stopped
    ports:
      - "5200:80"
    depends_on:
      - app
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: mnemos-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - RUN_MIGRATIONS=true
      - DATABASE_URL=postgresql://mnemos_user:mnemos_pass@db:5432/mnemos_db
      - REDIS_URL=redis://redis:6379/0
      # Ensure python doesn't buffer output so we see logs in realtime
      - PYTHONUNBUFFERED=1
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_DEVICE=cuda
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_DIMENSION=1024
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-.}
    volumes:
      - ./app:/app/app:rw
      - ./config:/app/config:rw
      - ./.env:/app/.env:ro
      - ./migrations:/app/migrations:rw
      - ./models:/app/models:ro
      - ./data/uploads:/app/uploads
      - ./data/archive:/app/archive
      - ./data/whisper_cache:/home/mnemos/.cache/whisper
      - ./data/hf_cache:/home/mnemos/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    extra_hosts:
      - "host.docker.internal:host-gateway" # For LM Studio access

  worker:
    build: .
    image: mnemos-backend:latest
    restart: unless-stopped
    # --pool=solo (one task at a time) is the default on purpose: the worker
    # loads embedding models onto the same GPU that llama.cpp occupies, so
    # concurrent tasks contend for VRAM. Override CELERY_POOL/CELERY_CONCURRENCY
    # only if inference moves off this machine.
    command: >
      sh -c "celery -A app.celery_app worker --loglevel=info
      --pool=${CELERY_POOL:-solo}
      ${CELERY_CONCURRENCY:+--concurrency=$CELERY_CONCURRENCY}"
    environment:
      - DATABASE_URL=postgresql://mnemos_user:mnemos_pass@db:5432/mnemos_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_DEVICE=cuda
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_DIMENSION=1024
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-.}
    volumes:
      - ./app:/app/app:rw
      - ./config:/app/config:rw
      - ./.env:/app/.env:ro
      - ./data/uploads:/app/uploads
      - ./data/archive:/app/archive
      - ./data/whisper_cache:/home/mnemos/.cache/whisper
      - ./data/hf_cache:/home/mnemos/.cache/huggingface
      - ./models:/app/models:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  llamacpp:
    # Rolling release with automatic fallback. llamacpp-preflight.ps1 backs
    # up the current image before pulling the latest. If the new image fails
    # health checks, llamacpp-healthcheck.ps1 reverts to the previous version.
    # The next restart will try the latest again (may be fixed).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    pull_policy: missing
    ports:
      - "8082:8080"
    environment:
      - LLAMACPP_NUM_CTX=${LLAMACPP_NUM_CTX:-16384}
      - LLAMACPP_MODEL_PATH=${LLAMACPP_MODEL_PATH:-/models/Hermes-3-Llama-3.2-3B.Q4_K_M.gguf}
      - LLAMACPP_GPU_LAYERS=${LLAMACPP_GPU_LAYERS:-99}
    volumes:
      - ./models:/models
    command: >
      --port 8080
      --host 0.0.0.0
      -m ${LLAMACPP_MODEL_PATH:-/models/Hermes-3-Llama-3.2-3B.Q4_K_M.gguf}
      -ngl ${LLAMACPP_GPU_LAYERS:-99}
      -c ${LLAMACPP_NUM_CTX:-16384}
      --fit off
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 10s
      retries: 25
      start_period: 300s

  mcp:
    build: .
    image: mnemos-backend:latest
    # Keep container running - MCP will be accessed via stdio (docker exec)
    # OpenCode will call: docker exec -i dev-mcp-1 python -m app.mcp_server.server
    command: tail -f /dev/null
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://mnemos_user:mnemos_pass@db:5432/mnemos_db
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:rw
      - ./config:/app/config:rw
      - ./data/uploads:/app/uploads

  db:
    image: pgvector/pgvector:pg16
    # Optimization: Tune Postgres for Vector Search
    # shared_buffers: ~25% of RAM (128MB is conservative default, setting 512MB)
    # work_mem: Memory for complex sorts/queries (vector search needs this)
    # maintenance_work_mem: Speed up index creation (HNSW build)
    command: >
      postgres  -c shared_buffers=512MB  -c work_mem=32MB  -c maintenance_work_mem=256MB
    environment:
      - POSTGRES_USER=mnemos_user
      - POSTGRES_PASSWORD=mnemos_pass
      - POSTGRES_DB=mnemos_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost only.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mnemos_user -d mnemos_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Optimization: Enable AOF (Append Only File) persistence
    # This prevents data loss (like Celery tasks) if the container restarts.
    command: [ "redis-server", "--appendonly", "yes" ]
    restart: unless-stopped
    ports:
      # Localhost only: infrastructure ports are not exposed to the LAN.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    # Opt-in only: `docker-compose --profile tools up -d adminer`
    profiles: [ "tools" ]
    restart: unless-stopped
    ports:
      # Localhost only.
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    volumes:
      - ./adminer_php.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
