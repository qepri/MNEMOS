name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + test dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.in -r requirements-dev.txt
      - name: Run backend suite with coverage
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Enforce coverage ratchet
        run: python scripts/check_coverage_baseline.py coverage.xml

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + test dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.in -r requirements-dev.txt
      - name: Run migration chain tests
        run: pytest -m migration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend_spa/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
