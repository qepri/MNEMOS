name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + test dependencies (CPU-only torch)
        # Install the PINNED lockfile, not requirements.in. requirements.in is
        # unpinned, so a fresh CI resolution drifts as upstream releases land
        # (e.g. a newer openai/httpx breaks respx interception and every faked
        # LLM/embedding test starts hitting the real network). The lockfile is
        # what ships in the image, so it is what CI must test. Filter the 16
        # nvidia-*/triton lines the CUDA-compiled lock carries and install with
        # the CPU torch index in front, in a single pip run - same idiom as the
        # Dockerfile (see CLAUDE.md "Releases are tag-locked").
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(nvidia-|triton)' requirements.lock.txt > requirements.cpu.txt
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements.cpu.txt -r requirements-dev.txt
      - name: Run backend suite with coverage
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Enforce coverage ratchet
        run: python scripts/check_coverage_baseline.py coverage.xml

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + test dependencies (CPU-only torch)
        # Install the pinned lockfile, not the unpinned requirements.in - see
        # the backend job for the full rationale.
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(nvidia-|triton)' requirements.lock.txt > requirements.cpu.txt
          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements.cpu.txt -r requirements-dev.txt
      - name: Run migration chain tests
        run: pytest -m migration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend_spa/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
